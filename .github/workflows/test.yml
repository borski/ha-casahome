name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Tests"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "git+https://github.com/borski/python-casahome.git@v0.2.0"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy custom_components tests
      - name: Pytest
        run: pytest -q
